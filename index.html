<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {

  }

  a { color: inherit; text-decoration: none; }

  .wrap { padding: 28px 16px 60px; }

    gap: 8px;

  }

  .btn {

    border: 1px solid #c9c3b8;
    background: transparent;
    color: #4a463f;
  }

  .btn.active {
    background: #1d1c1a;
    border-color: #1d1c1a;
    color: #faf8f4;
  }

  .btn-print {
    border: 1px solid #2c6570;
    background: #2c6570;
    color: #fff;
  }

  .sheet {
    max-width: 794px;
    margin: 0 auto;
    background: #faf8f4;
    box-shadow: 0 20px 50px rgba(0,0,0,.12);
    padding: 56px 60px 48px;
  }

  header {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 32px;
    align-items: end;
    border-bottom: 2px solid #1d1c1a;
    padding-bottom: 24px;
  }

  h1 {
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 400;
    font-size: 48px;
    line-height: 1;
    letter-spacing: -.01em;
  }

  h1 .last { font-weight: 700; }

  .kicker {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    letter-spacing: .22em;
    color: #6f6a63;
    margin-top: 9px;
  }

  .tagline {
    font-size: 15.5px;
    line-height: 1.5;
    margin-top: 14px;
    max-width: 46ch;
    color: #332f2b;
  }

  .contact {
    display: flex;
    flex-direction: column;
    gap: 7px;
    font-size: 13.5px;
    color: #4a463f;

  }

    font-size: 18px;
    line-height: 1.62;
    margin: 24px 0 0;
    color: #2a2724;
  }

  .sec-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 38px 0 16px;
  }

  .sec-head.first { gap: 14px; margin: 36px 0 4px; }

  .sec-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: #2c6570;
  }

  .sec-head h2 {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 20px;
    font-weight: 700;

  .sec-rule { flex: 1; height: 1px; background: #ded9d1; }

  .sec-kicker {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: .16em;
    color: #9a948b;
  }

  .jobs { display: flex; flex-direction: column; }

  .job {

    grid-template-columns: 112px 1fr;
    gap: 24px;
    padding: 22px 0;
    border-top: 1px solid #eae7e0;
  }

  .job-when { padding-top: 3px; }

  .job-years {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: #57534d;
  }

  .job-tag {

  .job-org { font-size: 15px; color: #57534d; margin-top: 3px; }

  .job-body ul {
    margin: 11px 0 0;
    padding-inline-start: 17px;
    font-size: 15px;
    line-height: 1.62;
    color: #332f2b;
  }

    line-height: 1.55;
    color: #4a463f;
    margin: 10px 0 0;
    padding-inline-start: 17px;
  }

    grid-template-columns: 1fr 1fr;
    gap: 40px;
    margin-top: 38px;

    font-size: 12px;
    color: #6f6a63;

    font-size: 11px;
    letter-spacing: .12em;
    color: #9a948b;

  .course-org { font-size: 13.5px; color: #57534d; line-height: 1.5; margin-top: 2px; }

  .strengths { font-size: 15px; line-height: 1.6; margin: 0 0 14px; color: #332f2b; }

  .pills { display: flex; flex-wrap: wrap; gap: 7px; }

  .pill {
    font-size: 13.5px;
    border: 1px solid #cdc7bc;
    padding: 5px 11px;
    border-radius: 999px;
  }

  .systems {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: #2c6570;
  }

  .systems span { background: #e6efef; padding: 5px 9px; }

  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    border-top: 1px solid #ded9d1;
    margin-top: 36px;
    padding-top: 13px;
    font-size: 12.5px;
    color: #8d8780;
  }

  .footer-mark {
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: .1em;
  }

    .sheet { padding: 34px 24px 32px; }
    header { grid-template-columns: 1fr; align-items: start; gap: 18px; }
    h1 { font-size: 38px; }
    .job { grid-template-columns: 1fr; gap: 10px; }
    .two-col { grid-template-columns: 1fr; }
  }

  @media print {
    body { background: #fff; }
    .no-print { display: none !important; }
    .wrap { padding: 0; }
    .sheet {
      box-shadow: none !important;
      margin: 0 !important;
      max-width: none !important;
      padding: 0 !important;
    }
    .job { break-inside: avoid; }
    @page { size: A4; margin: 12mm; }
  }
</style>

}

function setLang(lang) {
  const d = lang === 'he' ? HE : EN;
  const html = document.documentElement;
  html.setAttribute('lang', lang);
  html.setAttribute('dir', d.dir);
  document.title = d.title;
  document.getElementById('sheet').innerHTML = render(d);
  document.getElementById('btn-he').classList.toggle('active', lang === 'he');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-print').textContent = d.printLabel;
  try { localStorage.setItem('michal-cv-lang', lang); } catch (e) {}
}

(function init() {
  let lang = 'he';
  try {
    const saved = localStorage.getItem('michal-cv-lang');
    if (saved === 'he' || saved === 'en') lang = saved;
    else if (navigator.language && navigator.language.toLowerCase().startsWith('en')) lang = 'en';
  } catch (e) {}
  setLang(lang);
})();
</script>
</body>
</html>
